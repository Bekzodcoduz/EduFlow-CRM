<label class="dav-sababli-lbl dav-sababli-lbl--today" title="Faqat kelmaganida: sababli (to'lov bor)">
  <input type="checkbox"
    class="dav-sababli-cb"
    data-student="{{ student_pk }}"
    data-date="{{ day.date_str }}"
    {% if day.cell_kind == 'excused' %}checked{% endif %}
    {% if day.cell_kind == 'present' or day.cell_kind == 'empty' %}disabled{% endif %}
    onchange="onDavExcusedToggle(this)">
  <span class="dav-sababli-txt">Sababli</span>
</label>
