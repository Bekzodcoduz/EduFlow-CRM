{% extends 'base.html' %}
{% block title %}Sozlamalar — EduFlow{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <div class="page-title">Akkaunt sozlamalari</div>
    <div class="page-sub">Parolni yangilash.</div>
  </div>
</div>

<div class="card card-pad" style="max-width:720px">
    <div style="font-size:14px;font-weight:700;color:#4338ca;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #eef2ff">
      Parolni yangilash
    </div>
    {% if can_change_password %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="action" value="password">
      <div class="form-group">
        <label>Joriy parol</label>
        <input type="password" name="old_password" required>
      </div>
      <div class="form-group">
        <label>Yangi parol</label>
        <input type="password" name="new_password1" required>
      </div>
      <div class="form-group">
        <label>Yangi parolni tasdiqlang</label>
        <input type="password" name="new_password2" required>
      </div>
      <button type="submit" class="btn btn-primary">Parolni yangilash</button>
    </form>
    {% else %}
    <div style="font-size:13px;color:#6b7280">Bu akkaunt uchun parol o'rnatilmagan.</div>
    {% endif %}
</div>
{% endblock %}
